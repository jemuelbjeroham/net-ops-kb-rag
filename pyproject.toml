[project]
name = "net-ops-kb-rag"
version = "0.1.0"
description = "RAG system for Network Operations"
readme = "README.md"
authors = [
    { name = "Jemuel B Jeroham", email = "jemuelbjeroham@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-text-splitters>=1.1.2",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "netops_ingestion"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.0",
    "ruff>=0.16.3",
]
